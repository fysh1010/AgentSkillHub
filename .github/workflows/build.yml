name: Build Windows portable

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install frontend dependencies
        run: npm ci
      - name: Check types and test backend
        shell: pwsh
        run: |
          & ./node_modules/.bin/vue-tsc.cmd --noEmit
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --experimental-strip-types ./scripts/test-mcp-command.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --experimental-strip-types ./scripts/test-skill-categories.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --manifest-path src-tauri/Cargo.toml --lib --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build portable executable
        shell: pwsh
        run: |
          & ./node_modules/.bin/tauri.cmd build --no-bundle --ci --target x86_64-pc-windows-msvc -- --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Package and verify portable ZIP
        shell: pwsh
        run: |
          ./scripts/package-portable.ps1 -ExePath src-tauri/target/x86_64-pc-windows-msvc/release/agentskillhub.exe -OutputDirectory "$env:RUNNER_TEMP/release"
      - name: Publish portable release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          name: AgentSkillHub ${{ github.ref_name }} · 免安装版
          body_path: docs/releases/${{ github.ref_name }}.md
          files: ${{ runner.temp }}/release/AgentSkillHub-*-portable.zip
          fail_on_unmatched_files: true
          overwrite_files: false
          draft: false
          prerelease: false
          make_latest: true
      - name: Upload manual build artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64-portable
          path: ${{ runner.temp }}/release/AgentSkillHub-*-portable.zip
          if-no-files-found: error
