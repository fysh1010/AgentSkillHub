name: Build（Windows 安装包 + 便携版）

# 推送 v* 标签时自动构建 Windows x64 产物并挂到对应 Release；
# 也可在 Actions 页手动触发（产物作为 Artifact 下载）。
# 其他平台（macOS / Linux）：本仓库未提供官方构建，可参照 docs/DEVELOPMENT.md 自行打包。

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust 编译缓存
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 安装前端依赖
        run: npm ci

      - name: 构建 Windows 安装包
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: ${{ github.ref_name }}
          releaseBody: "AgentSkillHub Windows 构建（NSIS 安装包 + 免安装便携版）。需要 WebView2 运行时（Win11 自带）。"
          releaseDraft: false
          prerelease: false
          args: --target x86_64-pc-windows-msvc

      # 免安装便携版：裸 exe + 使用说明 打包成 zip，追加到同一 Release
      - name: 组装便携版 zip
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $stage = "$env:RUNNER_TEMP/portable/AgentSkillHub-portable"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item src-tauri/target/x86_64-pc-windows-msvc/release/agentskillhub.exe "$stage/AgentSkillHub.exe"
          @("AgentSkillHub $env:GITHUB_REF_NAME 便携版（免安装）", "", "1. 直接双击 AgentSkillHub.exe 运行（绿色版，不写注册表）。", "2. 需要 WebView2 运行时：Win11 自带；Win10 如无法启动请安装 WebView2。", "3. 配置数据保存在 %APPDATA%\com.agentskillhub.app\config.json。") | Set-Content "$stage/使用说明.txt" -Encoding UTF8
          Compress-Archive -Path $stage -DestinationPath "$env:RUNNER_TEMP/AgentSkillHub-$($env:GITHUB_REF_NAME)-portable.zip" -Force

      - name: 上传便携版到 Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ runner.temp }}/AgentSkillHub-*-portable.zip
          overwrite_files: true

      # 手动触发时没有 Release，产物以 Artifact 形式保留
      - name: 上传构建产物（手动触发时）
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: windows-bundles
          path: |
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/**/*
            src-tauri/target/x86_64-pc-windows-msvc/release/agentskillhub.exe
          if-no-files-found: ignore
