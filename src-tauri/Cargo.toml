[package]
name = "agentskillhub"
version = "0.2.0"
description = "AI Agent 技能统一管理台"
authors = ["admin"]
edition = "2021"

[lib]
name = "agentskillhub_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
